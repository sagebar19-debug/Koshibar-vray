name: Build and Push to GHCR

on:
  push:
    branches: [ "main", "master" ] # Déclenche l'action à chaque push sur main ou master
  workflow_dispatch: # Permet aussi de lancer l'action manuellement depuis l'onglet Actions de GitHub

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/sagebar19-debug/koshibar-vray:latest
